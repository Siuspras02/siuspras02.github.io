<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d3b2e" />
    <title>Riichi Tracker — Page not found</title>
    <!-- GitHub Pages serves this for any unknown path: send everything to the app -->
    <meta http-equiv="refresh" content="0; url=/Mahjong.html" />
    <script>
      // Root-absolute works for user sites; compute from origin as a safe fallback
      location.replace(location.origin + "/Mahjong.html");
    </script>
    <style>
      :root {
        --ink: #14231e;
        --ink-mute: #5d6e65;
        --ivory: #f4f2ec;
        --jade-700: #185c45;
        color-scheme: light;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--ivory);
        font-family: "Fraunces", Georgia, "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        text-align: center;
        padding: 20px;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 8px;
      }
      p {
        color: var(--ink-mute);
        font-size: 14px;
      }
      a {
        color: var(--jade-700);
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>That page rolled off the wall 🀄</h1>
      <p>
        Nothing lives at this address — taking you to the
        <a href="/Mahjong.html">Riichi Tracker scorekeeper</a>…
      </p>
    </main>
  </body>
</html>
